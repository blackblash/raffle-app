<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وب‌اپ قرعه‌کشی و خدمات</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-4 pb-24 font-sans">

  <!-- کارت پروفایل -->
  <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl mb-5 shadow-xl flex justify-between items-center">
    <div>
      <h2 id="userName" class="font-bold text-amber-400 text-lg">کاربر</h2>
      <p id="userPhone" class="text-xs text-slate-400">شماره: ثبت‌نشده</p>
    </div>
    <div class="text-left">
      <span class="text-xs text-slate-400 block">موجودی</span>
      <span id="userBalance" class="font-black text-emerald-400 text-lg">0 تومان</span>
    </div>
  </div>

  <!-- دکمه‌های دسترسی سریع -->
  <div class="grid grid-cols-2 gap-3 mb-6">
    <button onclick="alert('بخش شارژ کیف پول و درگاه ترون')" class="bg-amber-500 hover:bg-amber-600 font-bold p-3 rounded-xl text-slate-900 text-sm">
      💳 شارژ کیف پول
    </button>
    <button onclick="alert('فرم ثبت درخواست سفارش فروش')" class="bg-blue-600 hover:bg-blue-700 font-bold p-3 rounded-xl text-white text-sm">
      📦 ثبت سفارش فروش
    </button>
  </div>

  <!-- لیست قرعه‌کشی‌ها -->
  <h3 class="font-bold text-md mb-3 text-slate-300 flex items-center justify-between">
    <span>🎁 قرعه‌کشی‌های فعال</span>
    <button onclick="alert('تنظیم آلارم یادآوری')" class="text-xs text-amber-400 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700">🔔 تنظیم آلارم</button>
  </h3>

  <div id="rafflesList" class="space-y-4">
    <div class="bg-slate-800 p-4 rounded-xl text-center text-slate-400 border border-slate-700">
      در حال دریافت لیست قرعه‌کشی‌ها...
    </div>
  </div>

  <!-- بخش پشتیبانی و تیکت -->
  <div class="mt-8 bg-slate-800/60 p-4 rounded-2xl border border-slate-700">
    <h4 class="font-bold text-sm mb-2 text-slate-300">📩 ارسال تیکت پشتیبانی به ادمین</h4>
    <textarea id="ticketMsg" placeholder="پیام خود را بنویسید..." class="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-sm text-white mb-2 h-20 focus:outline-none"></textarea>
    <button onclick="sendTicket()" class="w-full bg-emerald-600 hover:bg-emerald-700 font-bold py-2 rounded-lg text-sm">ارسال تیکت</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const userId = tg.initDataUnsafe?.user?.id || 123456;
    const WORKER_URL = "https://tight-sun-71e8.blackblash13.workers.dev";

    async function init() {
      try {
        // دریافت پروفایل
        const uRes = await fetch(`${WORKER_URL}/api/user/${userId}`);
        const uData = await uRes.json();
        
        document.getElementById('userName').innerText = tg.initDataUnsafe?.user?.first_name || "کاربر";
        document.getElementById('userPhone').innerText = uData.phone ? `📱 ${uData.phone}` : "شماره: تاییدنشده";
        document.getElementById('userBalance').innerText = `${(uData.balance || 0).toLocaleString()} تومان`;

        // دریافت قرعه‌کشی‌ها
        const rRes = await fetch(`${WORKER_URL}/api/raffles`);
        const rData = await rRes.json();
        const container = document.getElementById('rafflesList');

        if (rData.length === 0) {
          container.innerHTML = `<div class="bg-slate-800 p-4 rounded-xl text-center text-slate-400 border border-slate-700">در حال حاضر قرعه‌کشی فعالی وجود ندارد.</div>`;
        } else {
          container.innerHTML = rData.map(r => `
            <div class="bg-slate-800 rounded-xl p-4 border border-slate-700">
              <h4 class="font-bold text-amber-400 mb-1">${r.title}</h4>
              <p class="text-xs text-slate-300 mb-2">${r.description || ''}</p>
              <div class="flex justify-between items-center text-xs text-slate-400 mb-3">
                <span>قیمت هر شانس: ${r.price || 0} تومان</span>
                <span>تایمر: ${r.timer || 'نامشخص'}</span>
              </div>
              <button class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2 rounded-lg text-xs">شرکت در قرعه‌کشی</button>
            </div>
          `).join('');
        }
      } catch (e) {
        console.error(e);
      }
    }

    function sendTicket() {
      const msg = document.getElementById('ticketMsg').value;
      if(!msg) return alert('لطفا پیامی بنویسید.');
      alert('تیکت شما برای مدیریت ارسال شد.');
      document.getElementById('ticketMsg').value = '';
    }

    init();
  </script>
</body>
</html>
