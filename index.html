<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پلتفرم قرعه‌کشی و شانس</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="p-4 pb-20">

  <!-- هدر و مشخصات کاربر -->
  <div class="bg-slate-800 p-4 rounded-2xl mb-6 shadow-lg flex justify-between items-center border border-slate-700">
    <div>
      <h2 id="userName" class="font-bold text-lg text-amber-400">در حال دریافت...</h2>
      <p id="userPhone" class="text-xs text-slate-400">---</p>
    </div>
    <div class="text-left">
      <span class="text-xs text-slate-400 block">موجودی کیف پول</span>
      <span id="userBalance" class="font-black text-emerald-400 text-lg">0 تومان</span>
    </div>
  </div>

  <!-- لیست قرعه‌کشی‌ها -->
  <h3 class="font-bold text-md mb-3 text-slate-300 flex items-center gap-2">
    🎁 قرعه‌کشی‌های فعال
  </h3>

  <div id="rafflesList" class="space-y-4">
    <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 text-center text-slate-400 py-8">
      در حال بارگذاری قرعه‌کشی‌ها...
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const userId = tg.initDataUnsafe?.user?.id || 123456; // تست
    const WORKER_URL = "https://tight-sun-71e8.blackblash13.workers.dev";

    async function loadUserData() {
      try {
        const res = await fetch(`${WORKER_URL}/api/user/${userId}`);
        const data = await res.json();
        
        document.getElementById('userName').innerText = tg.initDataUnsafe?.user?.first_name || "کاربر عزیز";
        document.getElementById('userPhone').innerText = data.phone ? `📱 ${data.phone}` : "احراز نشده";
        document.getElementById('userBalance').innerText = `${(data.balance || 0).toLocaleString()} تومان`;
      } catch (e) {
        console.error(e);
      }
    }

    loadUserData();
  </script>
</body>
</html>
